version: '3.8'

services:
  # -------------------------
  # 1. Python RAG Backend
  # -------------------------
  backend-python:
    image: goldflow/aquarag-backend-python:latest
    container_name: backend-python
    ports:
      - "8000:8000"
    environment:
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      PINECONE_INDEX_NAME: ${PINECONE_INDEX_NAME}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./backend-python/chroma_db:/app/chroma_db

  # -------------------------
  # 2. Java Spring Boot Backend
  # -------------------------
  backend-java:
    image: goldflow/aquarag-backend-java:latest
    container_name: backend-java
    ports:
      - "9000:9000"
    environment:
      SPRING_PROFILES_ACTIVE: prod

  # -------------------------
  # 3. Angular Frontend (Nginx)
  # -------------------------
  frontend:
    image: goldflow/aquarag-frontend:latest
    container_name: frontend
    ports:
      - "80:80"
